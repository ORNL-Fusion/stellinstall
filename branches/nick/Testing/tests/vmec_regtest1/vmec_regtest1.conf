# Configuration file for test

# EXEARGS is an array the arguments to be given to the executable

EXEARGS[0]="input.test"

# ACCPETED_FILES is an array specifying the names of the output files
# to be tested against "accepted files" of the same name.

ACCEPTED_FILES[0]="wout_test.nc"

# CMP_PROG is the name of the utility used to compare the output and
# accepted files.  CMP_PROG_ARGS is an array of strings, each 
# containing arguments to be sent to CMP_PROG
#
# CMP_PROG is assumed to have the usage:
# CMP_PROG [Options] file1 file2

CMP_PROG[0]=nccmp

CMP_PROG_ARGS[0]="-d -T 0.01"

# SVN_UPDATE_FILES set to "true" to automatically update accepted
# files and input files with subversion.
#SVN_UPDATE_FILES=true

# SVN_REVISION_NUMBER specifies from what revision the accepted files
# and input files are to come from.
#SVN_REVISION_NUMBER=1
